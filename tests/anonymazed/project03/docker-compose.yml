version: '3.8'

services:
  oauth2-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oauth2-llm-proxy
    ports:
      - "8080:8080"
    environment:
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_AUTH_SERVER_URL=${OAUTH_AUTH_SERVER_URL:-http://localhost:8000}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:8080/oauth/callback}
      - LLM_URL=${LLM_URL:-http://localhost:11434}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
    volumes:
      - oauth2-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  oauth2-data:
